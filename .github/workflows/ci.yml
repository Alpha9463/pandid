name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format (tests must stay formatted)
        run: ruff format --check tests

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        run: mypy pandid

  pyright:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pdf]"
      - name: pyright
        run: pyright pandid

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # Require binary wheels for optional PDF exports.
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -e ".[dev,pdf]"
      - name: pytest
        run: pytest -q

  smoke:
    name: Smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # Require binary wheels for optional PDF exports.
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -e ".[dev,pdf]"
      - name: Public API smoke test
        run: |
          python - <<'PY'
          from pandid import Feed, Flowsheet, Product

          flowsheet = Flowsheet("CI smoke")
          feed = flowsheet.add(Feed("Feed"))
          product = flowsheet.add(Product("Product"))
          flowsheet.connect(feed.outlet, product.inlet)
          assert "<svg" in flowsheet.to_svg()
          PY
          pandid --help
