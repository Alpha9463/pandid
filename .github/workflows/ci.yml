name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow calls these same gates on the tagged commit, so a
  # release runs the matrix that is actually maintained rather than a copy.
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format (tests must stay formatted)
        run: ruff format --check tests

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        run: mypy pandid

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # The pdf extra is installed here, and installed --only-binary, on every
        # interpreter in the matrix. That is the gate on issue #141: the extra
        # has to arrive as wheels and work with no system packages, so a member
        # that has to be built from source, or that has no wheel for a Python
        # this project claims, fails CI rather than the first user to try it.
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -e ".[dev,pdf]"
      - name: pytest
        run: pytest -q
