name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow calls these same gates on the tagged commit, so a
  # release runs the matrix that is actually maintained rather than a copy.
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      - name: ruff format (tests must stay formatted)
        run: ruff format --check tests

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        run: mypy pandid

  # A second type checker, because the two disagree about what they can see.
  # mypy was clean on the drawio overlay block that read a `Frame | None`
  # without narrowing it (issue #513) and pyright was not, and agents were
  # already citing a clean pyright run as evidence in pull request bodies --
  # so the project had the appearance of that coverage without the fact of
  # it, and a type error could land with every check green.
  pyright:
    name: Type check (pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # The `pdf` extra as well as `dev`, unlike the mypy job above, and it
        # is not optional here. mypy is told `ignore_missing_imports` and
        # shrugs at an absent third party; pyright calls one an **error** and
        # would have failed this job on `import PIL` in `render/preview.py`
        # before it ever read a line of pandid's own. Installing what the
        # optional paths import is the honest fix -- it is also the only way
        # those paths get checked at all, and `pdf` is a set of wheels the
        # test job already proves installs clean on this interpreter.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pdf]"
      # `pandid/` only, deliberately, and `tests/` is not an oversight: it
      # carries 1044 diagnostics today (issue #530), almost all of them the
      # same shape -- a test reaches through an Optional the suite has just
      # proved is there. That is its own piece of work, and a gate that
      # starts red is worse than no gate at all. The version is pinned in
      # the `dev` extra above, so this bar cannot move under the repo.
      - name: pyright
        run: pyright pandid

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # The pdf extra is installed here, and installed --only-binary, on every
        # interpreter in the matrix. That is the gate on issue #141: the extra
        # has to arrive as wheels and work with no system packages, so a member
        # that has to be built from source, or that has no wheel for a Python
        # this project claims, fails CI rather than the first user to try it.
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -e ".[dev,pdf]"
      - name: pytest
        run: pytest -q
