name: Release

# A version tag starts a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Run reusable CI against the tagged commit.
  gates:
    name: Gates
    uses: ./.github/workflows/ci.yml

  build:
    name: Build sdist + wheel
    needs: [gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Tag must match pandid.__version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          src="$(python -c 'import pandid; print(pandid.__version__)')"
          if [ "$tag" != "$src" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name pandid.__version__ ($src)"
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
      - name: Check the metadata PyPI will render
        run: twine check --strict dist/*
      - name: No artifact may carry a PDF
        run: |
          python - <<'PY'
          import glob, sys, tarfile, zipfile

          leaks = []
          for path in sorted(glob.glob("dist/*.tar.gz")):
              with tarfile.open(path) as tar:
                  leaks += [f"{path}: {n}" for n in tar.getnames() if n.lower().endswith(".pdf")]
          for path in sorted(glob.glob("dist/*.whl")):
              with zipfile.ZipFile(path) as whl:
                  leaks += [f"{path}: {n}" for n in whl.namelist() if n.lower().endswith(".pdf")]
          if leaks:
              print("::error::a build artifact carries a PDF; nothing under standards/ or "
                    "professional_examples/ may be published")
              print("\n".join(leaks))
              sys.exit(1)
          print("no PDF in any artifact")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pandid
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3