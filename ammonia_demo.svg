<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2000" height="2000">
  <defs>
    <g id="sym_product"><polygon points="0,0 20,25 0,50 50,50 50,0" fill="#fbe9e7" stroke="black"/></g>
    <g id="sym_separator"><rect x="0" y="0" width="50" height="50" fill="white" stroke="black" /></g>
    <g id="sym_reactor"><rect x="0" y="0" width="50" height="80" rx="10" fill="#f3e5f5" stroke="black"/></g>
    <g id="sym_hex"><circle cx="25" cy="25" r="25" fill="#fff3e0" stroke="black"/><path d="M 0,25 L 50,25" stroke="black"/></g>
    <g id="sym_mixer"><rect x="0" y="0" width="50" height="50" fill="white" stroke="black" /></g>
    <g id="sym_compressor"><rect x="0" y="0" width="50" height="50" fill="white" stroke="black" /></g>
    <g id="sym_feed"><polygon points="0,25 30,25 50,0 50,50" fill="#e0f7fa" stroke="black"/></g>
  </defs>
  <g id="units">
    <use href="#sym_feed" x="50" y="50" />
    <text x="50" y="45" font-family="sans-serif" font-size="12">Natural Gas</text>
    <use href="#sym_mixer" x="150" y="50" />
    <text x="150" y="45" font-family="sans-serif" font-size="12">M-101</text>
    <use href="#sym_reactor" x="250" y="35" />
    <text x="250" y="30" font-family="sans-serif" font-size="12">R-101</text>
    <use href="#sym_hex" x="400" y="50" />
    <text x="400" y="45" font-family="sans-serif" font-size="12">E-101</text>
    <use href="#sym_separator" x="550" y="50" />
    <text x="550" y="45" font-family="sans-serif" font-size="12">V-101</text>
    <use href="#sym_compressor" x="400" y="200" />
    <text x="400" y="195" font-family="sans-serif" font-size="12">K-101</text>
    <use href="#sym_product" x="700" y="75" />
    <text x="700" y="70" font-family="sans-serif" font-size="12">Ammonia</text>
  </g>
  <g id="streams">
    <polyline points="100.0,75.0 175.0,75.0" fill="none" stroke="black" stroke-width="2"/>
    <polyline points="175.0,75.0 250.0,75.0" fill="none" stroke="black" stroke-width="2"/>
    <polyline points="300.0,75.0 400.0,65.0" fill="none" stroke="black" stroke-width="2"/>
    <polyline points="450.0,65.0 575.0,75.0" fill="none" stroke="black" stroke-width="2"/>
    <polyline points="575.0,75.0 575,25 575,225 425.0,225.0" fill="none" stroke="black" stroke-width="2"/>
    <polyline points="425.0,225.0 150,225 175.0,75.0" fill="none" stroke="black" stroke-width="2"/>
    <polyline points="575.0,75.0 700.0,100.0" fill="none" stroke="black" stroke-width="2"/>
  </g>
</svg>