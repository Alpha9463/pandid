[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]

name = "pandid"
dynamic = ["version"]
description = "Generate chemical-engineering P&IDs and process flow diagrams with automatic layout and orthogonal stream routing."
readme = "README.md"
requires-python = ">=3.10"

license = "LicenseRef-PolyForm-Small-Business-1.0.0 AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE", "NOTICE"]
authors = [{ name = "Alex Anderson" }]
keywords = ["chemical-engineering", "p&id", "piping-and-instrumentation-diagram",
            "process-flow-diagram", "pfd", "flowsheet", "isa-5.1", "iso-10628"]


classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []


[project.scripts]
pandid = "pandid.cli:main"

[project.urls]
Homepage = "https://github.com/Alpha9463/pandid"
Repository = "https://github.com/Alpha9463/pandid"
Documentation = "https://github.com/Alpha9463/pandid/blob/main/docs/api.md"
Changelog = "https://github.com/Alpha9463/pandid/blob/main/CHANGELOG.md"
Issues = "https://github.com/Alpha9463/pandid/issues"

[project.optional-dependencies]
pdf = ["svglib>=2.0", "reportlab>=4.4.3", "pypdfium2>=4", "pillow>=9.1"]
yaml = ["PyYAML>=6"]      # enables Flowsheet.from_yaml(); from_dict/from_json need nothing
dev = ["pytest>=7", "ruff==0.15.14", "mypy>=1.8", "pyright==1.1.411", "PyYAML>=6",
       "hatchling"]

[tool.hatch.version]
path = "pandid/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pandid"]        # ships pandid/py.typed with it, so installers see the hints

[tool.hatch.build.targets.sdist]
exclude = [
    "tests",
    "tests/golden/*.svg",
    # Never redistributable.
    "standards",              # purchased BSI/ISO standards (PDF)
    "professional_examples",  # third-party reference drawings (PDF)
    # Local working files: agent/editor scratch, caches, environments, output.
    ".claude",
    ".superpowers",
    ".agents",
    ".venv",
    "venv",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "__pycache__",
    "*.py[cod]",
    "build",
    "dist",
    "*.egg-info",
    "renders",                # local render output
    "test_diagram.svg",       # scratch render at the repo root
    "test.py",
    "*.pgm",
    "skills-lock.json",
    "uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
ignore_missing_imports = true
