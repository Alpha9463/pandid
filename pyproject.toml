[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name is chem-pfd; the import name stays `pfd` (as scikit-learn
# installs but imports as sklearn). Plain "pfd" is taken on PyPI by an unrelated
# project (Parallel Fast Downloader).
name = "chem-pfd"
version = "0.0.1"
description = "Generate chemical-engineering Process Flow Diagrams with automatic layout and orthogonal stream routing."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Alex Anderson" }]
keywords = ["chemical-engineering", "process-flow-diagram", "pfd", "flowsheet"]
dependencies = []

[project.optional-dependencies]
pdf = ["cairosvg>=2.5"]   # enables PDF/PNG export via fs.render("x.pdf")
dev = ["pytest>=7", "ruff==0.15.14", "mypy>=1.8"]

[tool.hatch.build.targets.wheel]
packages = ["pfd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
ignore_missing_imports = true
