[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# `pandid` is how "P&ID" is said out loud, and is both the distribution name and
# the import name, so there is one name to remember. Plain "pfd" was not an
# option: it is taken on PyPI by an unrelated project (Parallel Fast Downloader).
name = "pandid"
dynamic = ["version"]     # read from pandid/__init__.py; see [tool.hatch.version]
description = "Generate chemical-engineering P&IDs and process flow diagrams with automatic layout and orthogonal stream routing."
readme = "README.md"
requires-python = ">=3.10"
# The engine is PolyForm Small Business; the vendored draw.io symbol geometry
# in pandid/render/_vendored_symbols.py stays Apache-2.0, as that licence requires.
# NOTICE says which files are which; the expression alone cannot.
license = "LicenseRef-PolyForm-Small-Business-1.0.0 AND Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE", "NOTICE"]
authors = [{ name = "Alex Anderson" }]
keywords = ["chemical-engineering", "p&id", "piping-and-instrumentation-diagram",
            "process-flow-diagram", "pfd", "flowsheet", "isa-5.1", "iso-10628"]
# No `License ::` trove classifier: `license` above is an SPDX expression, and
# Metadata 2.4 forbids carrying both (PyPI rejects the upload).
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

# A reader who installed `pandid` types `pandid`. `python -m pandid` runs the
# same entry point from a checkout.
[project.scripts]
pandid = "pandid.cli:main"

[project.urls]
Homepage = "https://github.com/Alpha9463/pandid"
Repository = "https://github.com/Alpha9463/pandid"
Documentation = "https://github.com/Alpha9463/pandid/blob/main/docs/api.md"
Changelog = "https://github.com/Alpha9463/pandid/blob/main/CHANGELOG.md"
Issues = "https://github.com/Alpha9463/pandid/issues"

[project.optional-dependencies]
pdf = ["cairosvg>=2.5"]   # enables PDF/PNG export via fs.render("x.pdf")
yaml = ["PyYAML>=6"]      # enables Flowsheet.from_yaml(); from_dict/from_json need nothing
dev = ["pytest>=7", "ruff==0.15.14", "mypy>=1.8", "PyYAML>=6"]

[tool.hatch.version]
path = "pandid/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pandid"]        # ships pandid/py.typed with it, so installers see the hints

# The sdist is the buildable, testable source: package, tests (goldens included,
# so the regression suite runs from the tarball), examples, docs and the stencil
# vendoring pipeline. Only editor/agent scratch is dropped.
[tool.hatch.build.targets.sdist]
exclude = [".claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
ignore_missing_imports = true
