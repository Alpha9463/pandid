<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2000" height="2000">
  <defs>
    <g id="sym_product"><polygon points="0,0 20,25 0,50 50,50 50,0" fill="#fbe9e7" stroke="black"/></g>
    <g id="sym_hex"><circle cx="25" cy="25" r="25" fill="#fff3e0" stroke="black"/><path d="M 0,25 L 50,25" stroke="black"/></g>
    <g id="sym_feed"><polygon points="0,25 30,25 50,0 50,50" fill="#e0f7fa" stroke="black"/></g>
    <g id="sym_reactor"><rect x="0" y="0" width="50" height="80" rx="10" fill="#f3e5f5" stroke="black"/></g>
    <g id="sym_compressor"><rect x="0" y="0" width="50" height="50" fill="white" stroke="black" /></g>
    <g id="sym_mixer"><rect x="0" y="0" width="50" height="50" fill="white" stroke="black" /></g>
    <g id="sym_separator"><rect x="0" y="0" width="50" height="50" fill="white" stroke="black" /></g>
  </defs>
  <g id="units">
    <use href="#sym_feed" x="0.0" y="0.0" />
    <text x="0.0" y="-5.0" font-family="sans-serif" font-size="12">Natural Gas</text>
    <use href="#sym_mixer" x="0.0" y="0.0" />
    <text x="0.0" y="-5.0" font-family="sans-serif" font-size="12">M-101</text>
    <use href="#sym_reactor" x="0.0" y="0.0" />
    <text x="0.0" y="-5.0" font-family="sans-serif" font-size="12">R-101</text>
    <use href="#sym_hex" x="0.0" y="0.0" />
    <text x="0.0" y="-5.0" font-family="sans-serif" font-size="12">E-101</text>
    <use href="#sym_separator" x="0.0" y="0.0" />
    <text x="0.0" y="-5.0" font-family="sans-serif" font-size="12">V-101</text>
    <use href="#sym_compressor" x="0.0" y="0.0" />
    <text x="0.0" y="-5.0" font-family="sans-serif" font-size="12">K-101</text>
    <use href="#sym_product" x="0.0" y="0.0" />
    <text x="0.0" y="-5.0" font-family="sans-serif" font-size="12">Ammonia</text>
  </g>
  <g id="streams">
    <polyline points="50.0,25.0 25.0,25.0" fill="none" stroke="black" stroke-width="2"/>
    <polyline points="25.0,25.0 0.0,40.0" fill="none" stroke="black" stroke-width="2"/>
    <polyline points="50.0,40.0 0.0,15.0" fill="none" stroke="black" stroke-width="2"/>
    <polyline points="50.0,15.0 25.0,25.0" fill="none" stroke="black" stroke-width="2"/>
    <polyline points="25.0,25.0 25.0,25.0" fill="none" stroke="black" stroke-width="2"/>
    <polyline points="25.0,25.0 25.0,25.0" fill="none" stroke="blue" stroke-width="2" stroke-dasharray="5,5"/>
    <polyline points="25.0,25.0 0.0,25.0" fill="none" stroke="black" stroke-width="2"/>
  </g>
</svg>